name: Host checks
# Offline login, saved-credential, key-issuance and DEV/PROD identity checks.
# GitHub-hosted runners only: PRs run with read-only contents and no secrets.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, Node 20
        with:
          persist-credentials: false
      - name: Host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang pkg-config python3 openssl ca-certificates libcurl4-openssl-dev libavformat-dev libavcodec-dev libswresample-dev libavutil-dev
      - name: Offline host checks
        run: bash scripts/ci-host-tests.sh

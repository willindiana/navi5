name: Read-only store verification
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact tag from independently approved frozen release receipt
        required: true
        type: string
      content_version:
        description: Numeric contentVersion from same approved receipt
        required: true
        type: string
      sha256:
        description: Install ZIP SHA-256 from same approved receipt (not live catalog)
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify deployed catalog (exit 2 means pending, not publication failure)
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
          EXPECTED_VERSION: ${{ inputs.content_version }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          python3 -B scripts/check-store-release.py --tag "$EXPECTED_TAG" \
            --content-version "$EXPECTED_VERSION" --sha256 "$EXPECTED_SHA256" \
            --attempts 20 --interval 60

name: Host checks
# Offline login, saved-credential, key-issuance and DEV/PROD identity checks.
# Forgejo runner; only the maintainer's own branches open PRs here (private repo).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, Node 20
        with:
          persist-credentials: false
      - name: Host dependencies
        run: |
          # The NAS runner's storage makes dpkg's per-file syncs very slow; this container is thrown away.
          echo force-unsafe-io | sudo tee /etc/dpkg/dpkg.cfg.d/90-ci-unsafe-io >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang pkg-config python3 openssl ca-certificates libcurl4-openssl-dev libavformat-dev libavcodec-dev libswresample-dev libavutil-dev
      - name: Offline host checks
        run: bash scripts/ci-host-tests.sh

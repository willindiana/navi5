name: Host checks
# Offline login, saved-credential, key-issuance and DEV/PROD identity checks.
# Forgejo runner; only the maintainer's own branches open PRs here (private repo).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    # Reuse the published CI image for this ci/ content, or build and push it.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, Node 20
        with:
          persist-credentials: false
      - id: image
        env:
          CI_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: bash scripts/ci-image.sh
  host:
    needs: image
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.PACKAGES_TOKEN }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, Node 20
        with:
          persist-credentials: false
      - name: Offline host checks
        run: bash scripts/ci-host-tests.sh

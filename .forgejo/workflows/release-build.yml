name: RELEASE validation build
on:
  push:
    branches: [master]
  # PR execution stays disabled until runner isolation/approval policy is verified.
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Store complete artifacts on this CI host (separate approval required)
        required: true
        default: 'false'
jobs:
  build:
    if: forgejo.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, Node 20
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang-18 lld-18 llvm-18 ca-certificates curl xz-utils unzip zip python3 python3-venv nasm meson ninja-build pkg-config cmake git
      - name: Build and enforce source delivery gate
        env:
          LLVM_CONFIG: llvm-config-18
        run: bash scripts/ci-release.sh
      # Forgejo-patched v4 uses Forgejo's artifact service, not GitHub's v4 service.
      - uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # patched v4
        if: success() && forgejo.event_name == 'workflow_dispatch' && inputs.upload_artifacts == 'true'
        with:
          name: Navi5-${{ forgejo.sha }}
          path: build/ci-release/
          if-no-files-found: error
          retention-days: 7

name: RELEASE validation build
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Store complete artifacts on this CI host (separate approval required)
        required: true
        default: 'false'
permissions:
  contents: read
jobs:
  image:
    # Reuse the published CI image for this ci/ content, or build and push it.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, Node 20
        with:
          persist-credentials: false
      - id: image
        env:
          CI_TOKEN: ${{ github.token }}
        run: bash scripts/ci-image.sh
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    needs: image
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, Node 20
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and enforce source delivery gate
        env:
          LLVM_CONFIG: llvm-config-18
        run: bash scripts/ci-release.sh
      # Never upload on failure, and never create a release or tag.
      # Forgejo-patched v4 uses Forgejo's artifact service, not GitHub's.
      - uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # patched v4
        if: success() && github.event_name == 'workflow_dispatch' && inputs.upload_artifacts == 'true'
        with:
          name: Navi5-${{ github.sha }}
          path: build/ci-release/
          if-no-files-found: error
          retention-days: 7

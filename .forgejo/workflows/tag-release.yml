name: Tag release
# On master: when contentVersion has no tag yet and is above the last release,
# tag the merge commit vX.Y.Z. The push mirror carries the tag to GitHub, where
# release.yml builds it, waits for the owner's PS5 test and approval, and
# publishes. The tag is created here because the mirror makes GitHub an exact
# copy of this repository: a tag created only on GitHub would be removed.
on:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, Node 20
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        name: Is this commit a new version?
        run: python3 -B scripts/release-version.py plan "$GITHUB_SHA"
      - name: Create the tag (never moves or replaces one)
        if: steps.plan.outputs.release == 'true'
        env:
          TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          python3 -I -c 'import json,os; print(json.dumps({"tag_name": os.environ["TAG"], "target": os.environ["GITHUB_SHA"], "message": "Navi5 " + os.environ["TAG"]}))' \
            | curl -fsS -X POST -H "Authorization: token ${TOKEN}" -H 'Content-Type: application/json' --data @- \
                "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/tags" >/dev/null
          echo "tagged ${TAG} at ${GITHUB_SHA}"

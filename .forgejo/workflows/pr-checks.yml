name: PR checks
# The scripts read the PR from the runner's event file; the description is never
# interpolated into the shell. Work-in-progress PRs (title "WIP:") are skipped.
# Release labels and versions: scripts/release-version.py (rules in AGENTS.md).
on:
  pull_request:
    branches: [master]
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
jobs:
  ps5-test-note:
    if: ${{ !startsWith(github.event.pull_request.title, 'WIP') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: https://github.com/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0, Node 24
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: PS5 test section
        run: python3 -B scripts/check-pr-test-note.py

  release-label:
    if: ${{ !startsWith(github.event.pull_request.title, 'WIP') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, Node 20
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Release label and version
        run: python3 -B scripts/release-version.py check-pr
